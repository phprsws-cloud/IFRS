<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diklat Instalasi Farmasi</title>
<style>
  :root{
    --navy:#21295C; --deepblue:#065A82; --teal:#1C7293; --ice:#EAF3F7;
    --amber:#E8A33D; --text:#1B2733; --grey:#5B6B76; --white:#FFFFFF;
    --danger:#B23A3A; --good:#1E8F5F;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--ice);color:var(--text);}
  h1,h2,h3{font-family:Georgia,'Cambria',serif;margin:0 0 .4em 0;color:var(--navy);}
  .app{max-width:900px;margin:0 auto;min-height:100vh;background:var(--white);box-shadow:0 0 40px rgba(0,0,0,.06);}
  .topbar{background:var(--navy);color:var(--white);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;}
  .topbar .title{font-family:Georgia,serif;font-size:19px;font-weight:bold;}
  .topbar .sub{font-size:12px;color:#AFC4D6;margin-top:2px;}
  .topbar button{background:transparent;border:1px solid #4A5A8C;color:#CADCE8;padding:7px 14px;border-radius:6px;font-size:12.5px;cursor:pointer;}
  .topbar button:hover{background:#2E3872;}
  .content{padding:32px 28px 60px 28px;}
  .progress{display:flex;gap:6px;margin-bottom:28px;}
  .progress div{flex:1;height:5px;border-radius:3px;background:#DDE7ED;}
  .progress div.done{background:var(--teal);}
  .progress div.now{background:var(--amber);}
  .card{background:var(--ice);border-radius:10px;padding:22px 24px;margin-bottom:16px;}
  label{display:block;font-size:13.5px;color:var(--grey);margin-bottom:6px;font-weight:600;}
  input[type=text]{width:100%;padding:11px 12px;border:1px solid #C9D6DE;border-radius:7px;font-size:15px;margin-bottom:16px;background:var(--white);}
  input[type=password]{width:100%;padding:11px 12px;border:1px solid #C9D6DE;border-radius:7px;font-size:15px;background:var(--white);}
  .btn{display:inline-block;background:var(--teal);color:var(--white);border:none;padding:12px 26px;border-radius:7px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn:hover{background:var(--deepblue);}
  .btn.amber{background:var(--amber);color:var(--navy);}
  .btn.amber:hover{background:#D6922E;}
  .btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .qnum{font-size:12.5px;color:var(--teal);font-weight:700;letter-spacing:.4px;margin-bottom:6px;}
  .qtext{font-size:16px;font-weight:600;margin-bottom:14px;line-height:1.5;}
  .opt{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border:1px solid #D8E3E9;border-radius:8px;margin-bottom:9px;cursor:pointer;background:var(--white);transition:border-color .15s;}
  .opt:hover{border-color:var(--teal);}
  .opt.selected{border-color:var(--teal);background:#EAF6F5;}
  .opt input{margin-top:3px;}
  .opt .otext{font-size:14.5px;line-height:1.4;}
  .navrow{display:flex;justify-content:space-between;margin-top:22px;}
  .slideimg{width:100%;border-radius:8px;border:1px solid #D8E3E9;display:block;}
  .matcard{background:var(--white);border:1px solid #D8E3E9;border-radius:10px;padding:26px 26px 30px 26px;min-height:340px;}
  .matcard .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.2px;color:var(--teal);margin-bottom:8px;}
  .matcard h2{font-size:22px;margin-bottom:14px;}
  .matbody{font-size:14.5px;line-height:1.65;color:var(--text);margin:0 0 14px 0;}
  .matlist{margin:0 0 14px 0;padding-left:20px;}
  .matlist li{font-size:14px;line-height:1.6;margin-bottom:7px;color:var(--text);}
  .matnumbered{margin:0 0 14px 0;padding-left:20px;}
  .matnumbered li{font-size:14px;line-height:1.6;margin-bottom:9px;color:var(--text);}
  .mattable{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:13px;}
  .mattable th{background:var(--navy);color:var(--white);padding:8px 10px;text-align:left;}
  .mattable td{padding:8px 10px;border-bottom:1px solid #E4EBEF;}
  .matcolumns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:14px;}
  .matcol{background:var(--ice);border-radius:8px;padding:14px;}
  .matcol h4{margin:0 0 8px 0;color:var(--navy);font-family:Georgia,serif;font-size:14.5px;}
  .matcol ul{margin:0;padding-left:18px;}
  .matcol li{font-size:12.5px;line-height:1.5;margin-bottom:5px;}
  .matnote{background:#FCEFDD;color:#8A5A0F;border-radius:8px;padding:12px 15px;font-size:13.5px;line-height:1.55;margin-top:4px;}
  .matchecklist{margin-bottom:8px;}
  .checkitem{font-size:14px;padding:8px 0;border-bottom:1px dashed #E4EBEF;color:var(--text);}
  .checkitem:last-child{border-bottom:none;}
  .slidecounter{text-align:center;color:var(--grey);font-size:13px;margin:10px 0 18px 0;}
  .materi-html{background:var(--white);border:1px solid #D8E3E9;border-radius:10px;padding:26px 26px 20px 26px;min-height:320px;}
  .materi-html .eyebrow{font-size:11.5px;color:var(--teal);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px;}
  .materi-html h2{font-size:22px;margin-bottom:14px;}
  .materi-html p{font-size:14.5px;line-height:1.65;color:var(--text);margin:0 0 12px 0;}
  .materi-html ul{margin:0 0 14px 20px;padding:0;}
  .materi-html li{font-size:14px;line-height:1.65;margin-bottom:7px;color:var(--text);}
  .materi-html table{width:100%;border-collapse:collapse;margin:6px 0 16px 0;font-size:13.5px;}
  .materi-html th{background:var(--navy);color:var(--white);padding:8px 10px;text-align:left;}
  .materi-html td{padding:8px 10px;border-bottom:1px solid #E4EBEF;}
  .materi-html .box-warn{background:#FCEFDD;border-left:4px solid var(--amber);padding:14px 16px;border-radius:8px;margin:14px 0;font-size:13.5px;color:#8A5A0F;}
  .materi-html .box-info{background:#E4F0F6;border-left:4px solid var(--teal);padding:14px 16px;border-radius:8px;margin:14px 0;font-size:13.5px;color:var(--deepblue);}
  .materi-html .box-warn b, .materi-html .box-info b{color:inherit;}
  .materi-html .step-list{counter-reset:step;list-style:none;margin:0 0 14px 0;padding:0;}
  .materi-html .step-list li{counter-increment:step;position:relative;padding-left:36px;margin-bottom:11px;font-size:14px;line-height:1.55;}
  .materi-html .step-list li::before{content:counter(step);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--teal);color:var(--white);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .materi-html .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .materi-html .tag{background:var(--ice);color:var(--deepblue);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:12px;}
  .banner{padding:16px 18px;border-radius:8px;margin-bottom:18px;font-size:14px;}
  .banner.info{background:#E4F0F6;color:var(--deepblue);}
  .banner.warn{background:#FCEFDD;color:#8A5A0F;}
  .resultbig{text-align:center;padding:28px 10px;}
  .scorecircle{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px auto;font-family:Georgia,serif;font-size:44px;font-weight:bold;color:var(--white);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;background:var(--navy);color:var(--white);padding:9px 10px;position:sticky;top:0;}
  td{padding:9px 10px;border-bottom:1px solid #E4EBEF;}
  tr:hover td{background:#F3F8FA;}
  .badge{padding:3px 10px;border-radius:12px;font-size:11.5px;font-weight:700;display:inline-block;}
  .badge.pass{background:#DCF3E7;color:var(--good);}
  .badge.fail{background:#FBE3E3;color:var(--danger);}
  .badge.pending{background:#EEE;color:var(--grey);}
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
  .statbox{background:var(--navy);color:var(--white);border-radius:9px;padding:16px;text-align:center;}
  .statbox .num{font-family:Georgia,serif;font-size:26px;font-weight:bold;}
  .statbox .lbl{font-size:11.5px;color:#AFC4D6;margin-top:3px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .tab{padding:8px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;background:var(--ice);color:var(--teal);border:1px solid #D8E3E9;}
  .tab.active{background:var(--teal);color:var(--white);border-color:var(--teal);}
  .modcard{border:1px solid #D8E3E9;border-radius:10px;padding:20px;margin-bottom:14px;cursor:pointer;transition:border-color .15s, background .15s;}
  .modcard:hover{border-color:var(--teal);background:#F5FAFB;}
  .modcard h3{margin-bottom:6px;}
  .modcard .meta{font-size:12px;color:var(--teal);font-weight:700;margin-bottom:8px;}
  .modcard p{font-size:13.5px;color:var(--grey);margin:0;}
  .foot{text-align:center;color:var(--grey);font-size:12px;padding:20px;}
  .eyebrow{font-size:11.5px;color:var(--teal);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
  .chip{display:inline-block;background:var(--ice);color:var(--deepblue);border:1px solid #CFE0E8;padding:5px 12px;border-radius:14px;font-size:12.5px;margin:2px 5px 2px 0;font-weight:600;}
  .steprow{display:flex;align-items:flex-start;margin-bottom:12px;}
  .stepcircle{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;font-size:13px;margin-right:12px;flex-shrink:0;}
  .mtable{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0 4px 0;}
  .mtable th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-weight:600;}
  .mtable td{padding:8px 10px;border-bottom:1px solid #E4EBEF;}
  .mpage p{line-height:1.6;font-size:14.5px;}
  .mpage ul{margin:6px 0 14px 0;padding-left:20px;line-height:1.6;font-size:14.5px;}
  .mpage li{margin-bottom:6px;}
  .mpage h3{font-size:16.5px;margin-top:6px;color:var(--navy);}
  .mpage h2{font-size:22px;margin-bottom:6px;}
  .mpage-wrap{background:var(--white);border:1px solid #D8E3E9;border-radius:10px;padding:26px 26px 22px 26px;min-height:320px;}
  @media (max-width:600px){ .statgrid{grid-template-columns:repeat(2,1fr);} .content{padding:20px 16px 50px 16px;} }
</style>
</head>

async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function findByNip(nip){
  const hash = await sha256Hex(nip);
  return ROSTER.find(r => r.hash === hash);
}

    materiPages: ["<div class=\"mpage\">\n  <div class=\"eyebrow\">Sasaran Keselamatan Pasien &middot; PKPO</div>\n  <h2>Apa itu Akreditasi Rumah Sakit?</h2>\n  <p>Akreditasi adalah pengakuan formal terhadap rumah sakit yang telah memenuhi standar pelayanan yang ditetapkan, dinilai oleh <b>lembaga independen penyelenggara akreditasi</b> yang ditetapkan oleh Menteri Kesehatan &mdash; melalui proses survei berkala.</p>\n  <p>Sejak 2021, ada beberapa lembaga yang diakui (bukan cuma satu), di antaranya <b>KARS, LAFKI, LARS-DHP, LARS, LAM-KPRS, dan LARSI</b>. Semua memakai standar yang sama (STARKES), dan pimpinan rumah sakit bebas memilih lembaga mana yang digunakan.</p>\n  <ul>\n    <li><b>Menjamin Mutu</b> &mdash; memastikan pelayanan pasien konsisten dan aman di setiap unit, termasuk farmasi.</li>\n    <li><b>Keselamatan Pasien</b> &mdash; menurunkan risiko insiden terkait obat melalui standar &amp; prosedur yang terukur.</li>\n    <li><b>Legalitas &amp; Kepercayaan</b> &mdash; syarat operasional RS dan dasar kepercayaan pasien serta mitra rujukan.</li>\n  </ul>\n</div>", "<div class=\"mpage\">\n  <div class=\"eyebrow\">Landasan Hukum</div>\n  <h2>Dasar Hukum &amp; Regulasi</h2>\n  <table class=\"mtable\"><thead><tr><th>Regulasi</th><th>Keterangan</th></tr></thead><tbody>\n    <tr><td>UU No. 17 Tahun 2023</td><td>Tentang Kesehatan</td></tr>\n    <tr><td>Kepmenkes No. HK.01.07/MENKES/1596/2024</td><td>Standar Akreditasi Rumah Sakit</td></tr>\n    <tr><td>Permenkes No. 72 Tahun 2016</td><td>Standar Pelayanan Kefarmasian di Rumah Sakit</td></tr>\n    <tr><td>Kepdirjen Yankes No. HK.02.02.D.43961/2024</td><td>Pedoman Survei Akreditasi Rumah Sakit</td></tr>\n  </tbody></table>\n</div>", "<div class=\"mpage\">\n  <div class=\"eyebrow\">Struktur Standar</div>\n  <h2>Struktur Standar Akreditasi RS</h2>\n  <p>Ada banyak bab standar akreditasi (AKP, PP, PAP, PAB, MRMIK, KE, PROGNAS, PMKP, TKRS, MFK, PPI, KPS, HPK) &mdash; namun fokus pelatihan ini pada bab yang paling melekat dengan tugas harian staf farmasi:</p>\n  <div class=\"banner info\"><b>PKPO &mdash; Pelayanan Kefarmasian dan Penggunaan Obat.</b> Mengatur seluruh siklus obat di rumah sakit: organisasi, seleksi &amp; pengadaan, penyimpanan, peresepan, dispensing, pemberian, hingga pemantauan efek obat. Instalasi Farmasi adalah pemilik proses utama standar ini.</div>\n</div>", "<div class=\"mpage\">\n  <div class=\"eyebrow\">PKPO 1</div>\n  <h2>Pengorganisasian Pelayanan Farmasi</h2>\n  <p>Rumah sakit wajib memiliki sistem pengorganisasian pelayanan kefarmasian dan penggunaan obat yang jelas.</p>\n  <ul>\n    <li>Regulasi &amp; pedoman pelayanan farmasi ditetapkan tertulis dan berlaku di seluruh unit.</li>\n    <li>Pelayanan kefarmasian bukan hanya tanggung jawab apoteker &mdash; melibatkan dokter, perawat, TTK, dan staf non-klinis.</li>\n    <li>Tersedia sumber informasi obat (dosis, interaksi, efek samping, stabilitas) dalam bentuk cetak dan/atau elektronik.</li>\n    <li>Struktur organisasi dan tata hubungan kerja mengacu pada peraturan perundang-undangan yang berlaku.</li>\n  </ul>\n</div>", "<div class=\"mpage\">\n  <div class=\"eyebrow\">PKPO 2 &amp; 3</div>\n  <h2>Seleksi, Pengadaan, dan Penyimpanan</h2>\n  <h3>Seleksi &amp; Pengadaan</h3>\n  <ul>\n    <li>Formularium RS ditetapkan &amp; dievaluasi berkala (minimal 1x/tahun).</li>\n    <li>Proses seleksi obat baru berbasis bukti &amp; kebutuhan klinis.</li>\n    <li>Prosedur bila obat kosong / tidak tersedia (obat substitusi).</li>\n  </ul>\n  <h3>Penyimpanan</h3>\n  <ul>\n    <li>Penyimpanan sesuai suhu, cahaya, kelembapan, dan stabilitas sediaan.</li>\n    <li>Sistem FEFO/FIFO diterapkan konsisten untuk cegah kedaluwarsa.</li>\n    <li>Obat rusak/kedaluwarsa ditarik &amp; dimusnahkan sesuai prosedur.</li>\n  </ul>\n  <h3>Kontrol Suhu Penyimpanan</h3>\n  <p>Suhu ruang dan lemari pendingin penyimpanan obat wajib dipantau dan dicatat secara berkala (mis. 2x sehari) untuk menjaga stabilitas dan mutu obat, terutama obat yang sensitif suhu (vaksin, insulin, dan sediaan tertentu). Pencatatan suhu ini menjadi bukti kepatuhan penting saat disurvei akreditasi.</p>\n</div>", "<div class=\"mpage\">\n  <div class=\"eyebrow\">PKPO 3.1 &middot; SKP 3</div>\n  <h2>Obat High-Alert &amp; Elektrolit Pekat</h2>\n  <div class=\"banner warn\">\n    <b>Perhatian khusus</b><br>\n    Elektrolit konsentrat (mis. KCl, NaCl 3%, MgSO4) hanya boleh disimpan di Instalasi Farmasi, kecuali kondisi klinis khusus yang diatur ketat. Wajib diberi label \"HIGH ALERT\" mencolok dan dipisahkan dari obat lain. Obat LASA (Look-Alike Sound-Alike) disimpan tidak berdekatan dan diberi label khusus.\n  </div>\n</div>", "<div class=\"mpage\">\n  <div class=\"eyebrow\">PKPO 3.2</div>\n  <h2>Obat &amp; Troli Emergensi</h2>\n  <ul>\n    <li><b>Penyimpanan Seragam</b> &mdash; obat emergensi di luar farmasi dikelola seragam: penyimpanan, pemantauan, penggantian saat dipakai/rusak/kedaluwarsa.</li>\n    <li><b>Segel Bernomor Seri</b> &mdash; troli/kotak emergensi wajib terkunci dengan segel bernomor seri untuk mendeteksi penggunaan tanpa izin.</li>\n    <li><b>Tata Laksana Cepat</b> &mdash; ada tata laksana baku agar pemberian obat emergensi tepat dan cepat saat kondisi kritis.</li>\n  </ul>\n</div>", "<div class=\"mpage\">\n  <div class=\"eyebrow\">PKPO 4 &amp; 4.1</div>\n  <h2>Peresepan &amp; Rekonsiliasi Obat</h2>\n  <h3>Rekonsiliasi Obat</h3>\n  <p><b>Tujuan utama rekonsiliasi</b> adalah mencegah diskrepansi (ketidaksesuaian) obat dan kejadian tidak diharapkan akibat informasi obat yang tidak lengkap/akurat. Dilakukan pada tiga momen: saat pasien masuk RS, pindah antar unit, dan sebelum pulang. Hasil rekonsiliasi wajib didokumentasikan &amp; dikomunikasikan ke PPA serta pasien/keluarga.</p>\n  <h3>Kelengkapan Resep</h3>\n  <ul>\n    <li>Identitas pasien, nama obat, dosis, rute, waktu pemberian.</li>\n    <li>Nama &amp; tanda tangan/paraf dokter penulis resep.</li>\n    <li>Obat pulang disertai edukasi penggunaan ke pasien.</li>\n  </ul>\n</div>", "<div class=\"mpage\">\n  <div class=\"eyebrow\">PKPO 5</div>\n  <h2>Dispensing (Penyiapan Obat)</h2>\n  <div><span class=\"chip\">1. Verifikasi Resep</span><span class=\"chip\">2. Penyiapan &amp; Peracikan</span><span class=\"chip\">3. Pelabelan</span><span class=\"chip\">4. Pemeriksaan Ganda</span><span class=\"chip\">5. Penyerahan</span></div>\n  <p style=\"margin-top:12px;\">Teknik aseptik wajib diterapkan untuk sediaan steril (mis. pencampuran sitostatika/IV admixture) dalam ruang khusus sesuai standar, dengan staf yang terlatih dan tersertifikasi.</p>\n  <h3>Kelengkapan Etiket Obat</h3>\n  <ul>\n    <li>Nama pasien</li>\n    <li>Nama obat &amp; kekuatan/dosis</li>\n    <li>Cara pemakaian / aturan pakai</li>\n    <li>Tanggal penyiapan atau penyerahan</li>\n    <li>Tanggal kadaluarsa obat</li>\n  </ul>\n</div>", "<div class=\"mpage\">\n  <div class=\"eyebrow\">PKPO 7</div>\n  <h2>Pemantauan Terapi Obat</h2>\n  <p><b>Tujuan utama pemantauan terapi obat</b> adalah mendeteksi efek terapi maupun efek samping/reaksi obat yang tidak diinginkan sedini mungkin, demi keamanan pasien.</p>\n  <ul>\n    <li><b>Efek Terapi &amp; Efek Samping</b> &mdash; pasien dipantau untuk melihat respons terhadap terapi dan mendeteksi reaksi obat yang tidak diinginkan (ROTD/MESO) sedini mungkin.</li>\n    <li><b>Pelaporan Insiden Obat</b> &mdash; KNC, KTD, dan kesalahan obat dilaporkan melalui sistem pelaporan insiden RS.</li>\n    <li><b>Kolaborasi PPA</b> &mdash; apoteker berkolaborasi dengan dokter &amp; perawat dalam evaluasi berkelanjutan atas efektivitas dan keamanan terapi obat pasien.</li>\n  </ul>\n</div>", "<div class=\"mpage\">\n  <div class=\"eyebrow\">Keselamatan Pasien</div>\n  <h2>Klasifikasi Insiden Terkait Obat</h2>\n  <p>Setiap insiden keselamatan pasien terkait obat (<i>medication error</i>) diklasifikasikan berdasarkan tingkat keparahannya:</p>\n  <table class=\"mtable\"><thead><tr><th>Klasifikasi</th><th>Definisi</th></tr></thead><tbody>\n    <tr><td>KPC (Kondisi Potensial Cedera)</td><td>Kondisi/situasi berisiko menimbulkan cedera, namun belum terjadi insiden nyata</td></tr>\n    <tr><td>KNC (Kejadian Nyaris Cedera)</td><td>Insiden yang belum sampai terpapar ke pasien (tertangkap/dicegah sebelum sampai ke pasien)</td></tr>\n    <tr><td>KTC (Kejadian Tidak Cedera)</td><td>Insiden sudah terpapar ke pasien, tetapi tidak menimbulkan cedera</td></tr>\n    <tr><td>KTD (Kejadian Tidak Diharapkan)</td><td>Insiden yang mengakibatkan cedera pada pasien</td></tr>\n    <tr><td>Sentinel</td><td>KTD yang mengakibatkan kematian, cedera permanen, atau cedera berat sementara &mdash; wajib investigasi &amp; respons segera</td></tr>\n  </tbody></table>\n  <div class=\"banner warn\"><b>Penting:</b> semua insiden (termasuk KNC/nyaris cedera) wajib dilaporkan melalui sistem pelaporan insiden RS, bukan hanya yang sudah menimbulkan cedera.</div>\n</div>", "<div class=\"mpage\">\n  <div class=\"eyebrow\">Temuan Survei</div>\n  <h2>Elemen yang Sering Bermasalah Saat Survei</h2>\n  <table class=\"mtable\"><thead><tr><th>Elemen</th><th>Temuan Umum</th></tr></thead><tbody>\n    <tr><td>Penyimpanan (PKPO 3)</td><td>Suhu penyimpanan tidak termonitor konsisten, FEFO/FIFO tidak berjalan, label high-alert kurang mencolok</td></tr>\n    <tr><td>Dokumentasi Rekonsiliasi</td><td>Rekonsiliasi obat tidak lengkap saat transfer pasien antar unit</td></tr>\n    <tr><td>Obat Emergensi</td><td>Segel troli emergensi tidak tercatat / tidak diperiksa berkala</td></tr>\n    <tr><td>Pelabelan Obat Racikan</td><td>Label tidak mencantumkan tanggal penyiapan, waktu, dan tanggal kadaluarsa secara lengkap</td></tr>\n  </tbody></table>\n</div>", "<div class=\"mpage\">\n  <div class=\"eyebrow\">Peran Anda</div>\n  <h2>Peran Anda dalam Kesiapan Akreditasi</h2>\n  <ul>\n    <li>Menjalankan SPO secara konsisten, bukan hanya saat menjelang survei.</li>\n    <li>Mendokumentasikan setiap tindakan (rekonsiliasi, pemantauan, pelaporan insiden) secara real-time.</li>\n    <li>Memahami lokasi &amp; alasan penyimpanan obat high-alert dan elektrolit pekat.</li>\n    <li>Aktif melapor bila menemukan penyimpangan atau potensi risiko.</li>\n    <li>Mengikuti pelatihan &amp; uji kompetensi berkelanjutan sebagai bukti pengembangan staf (KPS).</li>\n  </ul>\n  <div class=\"banner info\"><b>Siap lanjut?</b> Selesaikan Post-Test untuk mengukur pemahaman Anda tentang standar PKPO &amp; keselamatan pasien terkait obat. Nilai minimal kelulusan (KKM): 80.</div>\n</div>"]

    materiPages: [
      `<div class="mpage">
        <div class="eyebrow">Sasaran Keselamatan Pasien 3 &middot; PKPO 3 / 3.1</div>
        <h2>Mengapa Ini Penting</h2>
        <p><b>High-Alert Medication (HAM)</b> adalah obat yang harus diwaspadai karena berisiko tinggi menimbulkan kesalahan serius (sentinel event) atau Reaksi Obat yang Tidak Diinginkan (ROTD) apabila terjadi kesalahan penggunaan.</p>
        <p>Peningkatan keamanan obat yang perlu diwaspadai adalah salah satu dari 6 Sasaran Keselamatan Pasien (<b>SKP 3</b>) dan menjadi Elemen Penilaian pada standar <b>PKPO 3</b> &amp; <b>PKPO 3.1</b>.</p>
        <div class="banner warn"><b>Dampak jika salah kelola:</b> kematian atau kecacatan pasien, kejadian sentinel/KTD berulang, hilangnya kepercayaan pasien, dan temuan ketidakpatuhan saat survei akreditasi.</div>
      </div>`,

      `<div class="mpage">
        <div class="eyebrow">Klasifikasi</div>
        <h2>3 Kategori Obat High Alert</h2>
        <div><span class="chip">1. Obat Risiko Tinggi</span><span class="chip">2. LASA / NORUM</span><span class="chip">3. Elektrolit Pekat</span></div>
        <ul style="margin-top:14px;">
          <li><b>Obat Risiko Tinggi</b> — berpotensi menimbulkan kematian/kecacatan bila salah guna: insulin, heparin, agen anestesi, obat inotropik, antiaritmia, narkotika IV.</li>
          <li><b>LASA / NORUM</b> — Look Alike Sound Alike / Nama Obat Rupa Ucapan Mirip, rawan tertukar karena kemasan atau pengucapan serupa.</li>
          <li><b>Elektrolit Pekat</b> — KCl 7,46%, MgSO4 20% &amp; 40%, NaCl 3%, Meylon 8,4%, D40% — hanya disimpan di Instalasi Farmasi (kecuali MgSO4 di VK).</li>
        </ul>
      </div>`,

      `<div class="mpage">
        <div class="eyebrow">Kategori 2</div>
        <h2>Waspada Obat LASA / NORUM</h2>
        <p>Nama, kemasan, atau ucapan yang mirip berisiko menyebabkan salah ambil obat.</p>
        <h3>Ucapan Mirip (Sound Alike)</h3>
        <ul><li>amiTRIPTYlin — amiNOPHYlin</li><li>ephEDrin — ephiNEPHrin</li><li>doPAmine — doBUTamin</li></ul>
        <h3>Rupa Mirip (Look Alike)</h3>
        <ul><li>Dexamethasone inj — Epinefrin — Sulfas Atropin</li><li>Citicolin inj — Ondancetron inj</li><li>Cefotaxim inj — Ceftriaxon — Ampisilin</li></ul>
        <h3>Nama Sama, Kekuatan Beda</h3>
        <ul><li>Amlodipin 5 mg — Amlodipin 10 mg</li><li>Concor 1,25 — 2,5 — 5 mg</li><li>Metformin 500 mg — 850 mg</li></ul>
        <div class="banner info">Obat LASA disimpan tidak berdekatan — beri jarak minimal 2 obat lain di antaranya.</div>

        <h2>Prinsip Penyimpanan &amp; Pelabelan Obat HAM</h2>
        <ul>
          <li>Disimpan pada rak/lemari terpisah dari obat lain, dengan akses terbatas.</li>
          <li>Disusun berdasarkan stabilitas, bentuk sediaan, urutan alfabetis, serta sistem FIFO dan FEFO.</li>
          <li>Narkotika &amp; psikotropika disimpan dalam lemari kunci ganda (double lock); kunci dipegang penanggung jawab shift.</li>
          <li>Elektrolit pekat: hanya di Instalasi Farmasi, kecuali MgSO4 di VK — sesuai PerBPOM 5/2026.</li>
        </ul>

      `<div class="mpage">
        <div class="eyebrow">Peresepan &amp; Penyiapan</div>
        <h2>Peresepan Obat HAM — Tidak Boleh Verbal</h2>
        <p>Instruksi pengobatan HAM <b>TIDAK boleh</b> diberikan hanya secara verbal/lisan, kecuali kondisi emergensi (nama obat harus dieja per huruf).</p>
        <h3>Alur Penyiapan Obat HAM oleh Farmasi</h3>
        <div class="steprow"><div class="stepcircle">1</div><div>Cek resep dokter &amp; cek stok di lemari khusus HAM</div></div>
        <div class="steprow"><div class="stepcircle">2</div><div>Entry resep di SIMRS sesuai jumlah permintaan</div></div>
        <div class="steprow"><div class="stepcircle">3</div><div>Verifikasi 5 Benar sebelum pengambilan, ambil obat dari lemari bertanda khusus</div></div>
        <div class="steprow"><div class="stepcircle">4</div><div>Tulis etiket lengkap (nama, RM, obat, jumlah, ED, aturan pakai)</div></div>
        <div class="steprow"><div class="stepcircle">5</div><div>Pemeriksaan akhir oleh petugas berbeda (double check)</div></div>
        <h3>Double Check Wajib Dilakukan Saat</h3>
        <ul><li>Akan memberikan obat injeksi HAM</li><li>Terapi infus inisial</li><li>Perubahan konsentrasi obat</li><li>Pemberian bolus</li><li>Pergantian jaga perawat / transfer pasien</li><li>Perubahan dosis obat</li></ul>
      </div>`,
      `<div class="mpage">
        <div class="eyebrow">Pemberian</div>
        <h2>Prinsip 5 Benar &amp; Elektrolit Pekat</h2>

        <p style="margin-top:12px;">Untuk pemberian HAM via infus (drip/continuous infusion): <b>kolf infus itu sendiri</b> (bukan RPO) wajib ditempeli label/stiker berisi: Nama pasien, No. RM, Tanggal Lahir, Infus/Pelarut, Volume, Botol ke-, Ruang, Obat yang Ditambahkan &amp; jumlahnya, Tanggal &amp; Jam pemberian, serta nama petugas yang memberikan dan yang memeriksa.</p>

        <ul>
          <li>Periksa kelengkapan dokumen permintaan dengan prinsip 5 Benar</li>
          <li>Lakukan double check terhadap instruksi pengobatan</li>

          <li>Hitung volume pelarut, lakukan pengenceran secara aseptis</li>

/* ================= STORAGE: GOOGLE FORM (tulis) + APPS SCRIPT (baca) ================= */
/* Versi GitHub Pages: tidak ada window.storage (itu khusus artifact Claude),
   jadi penyimpanan utama pakai Google Form -> Google Sheets, dibaca kembali via
   Apps Script Web App (teknik JSONP, aman dari CORS). Kalau nanti form/script
   berubah, update GFORM_CONFIG dan GAPPS_SCRIPT_URL di bawah ini. */
const GFORM_CONFIG = {
  actionUrl: "https://docs.google.com/forms/d/e/1FAIpQLSe0QyDcOdetdvMg1KemUiX-WSUQ6Nc8XszipoWF1lvAbLHVmA/formResponse",
  fields: {

    pretestScore: "entry.871486590",
    posttestScore: "entry.985894930",
    status: "entry.799099750",
    timestamp: "entry.1876257130"
  }
};
const GAPPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwa_CqyJnv4TRZhVwRgZgFVpbEZHZgvPhJn9Db9erhfegWnrV-4G1SUeiMTIJPTR-ld/exec";

async function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

function submitToGoogleForm(record){
  return new Promise((resolve) => {
    try{
      let iframe = document.getElementById('gform_hidden_iframe');
      if(!iframe){
        iframe = document.createElement('iframe');
        iframe.name = 'gform_hidden_iframe';
        iframe.id = 'gform_hidden_iframe';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);
      }
      const values = {};
      values[GFORM_CONFIG.fields.name] = record.name;
      values[GFORM_CONFIG.fields.staffId] = record.staffId;
      values[GFORM_CONFIG.fields.moduleTitle] = record.moduleTitle;
      values[GFORM_CONFIG.fields.pretestScore] = record.pretestScore;
      values[GFORM_CONFIG.fields.posttestScore] = record.posttestScore;
      values[GFORM_CONFIG.fields.status] = record.status;
      values[GFORM_CONFIG.fields.timestamp] = new Date(record.timestamp).toLocaleString('id-ID');

      const form = document.createElement('form');
      form.action = GFORM_CONFIG.actionUrl;
      form.method = 'POST';
      form.target = 'gform_hidden_iframe';
      Object.keys(values).forEach((key) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = values[key];
        form.appendChild(input);
      });
      document.body.appendChild(form);
      form.submit();
      setTimeout(() => { try{ form.remove(); }catch(e){} }, 1500);
      setTimeout(() => resolve(true), 700);
    }catch(e){
      console.error('gform submit failed', e);
      resolve(false);
    }
  });
}

async function saveRecord(rec){
  const maxAttempts = 3;
  for(let attempt=1; attempt<=maxAttempts; attempt++){
    const ok = await submitToGoogleForm(rec);
    if(ok) return { ok:true, attempts:attempt };
    if(attempt < maxAttempts){ await sleep(800 * attempt); }
  }
  return { ok:false, reason:'error', attempts:maxAttempts };
}

function findModuleIdByTitle(title){
  const found = Object.keys(MODULES).find(id => MODULES[id].title === title);
  return found || null;
}
function fetchViaJsonp(url, timeoutMs){
  return new Promise((resolve) => {
    const callbackName = 'gsheetCb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    let settled = false;
    const cleanup = () => {
      delete window[callbackName];
      if(script.parentNode) script.parentNode.removeChild(script);
    };
    window[callbackName] = (data) => {
      if(settled) return;
      settled = true;
      cleanup();
      resolve(data);
    };
    const script = document.createElement('script');
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + callbackName;
    script.onerror = () => {
      if(settled) return;
      settled = true;
      cleanup();
      resolve({ error:true, message:'Gagal memuat script JSONP.' });
    };
    document.body.appendChild(script);
    setTimeout(() => {
      if(settled) return;
      settled = true;
      cleanup();
      resolve({ error:true, message:'Waktu tunggu habis (timeout).' });
    }, timeoutMs || 8000);
  });
}
async function listAllRecords(){
  try{
    const rows = await fetchViaJsonp(GAPPS_SCRIPT_URL, 8000);
    if(rows && rows.error){ return { records:[], unavailable:false, error:true, message: rows.message }; }
    if(!Array.isArray(rows)){ return { records:[], unavailable:false, error:true, message:'Format data tidak dikenali.' }; }
    const records = rows.map(row => {
      const moduleTitle = (row['Modul'] || '').toString().trim();
      const moduleId = findModuleIdByTitle(moduleTitle);
      const waktuStr = (row['Waktu'] || '').toString().trim();
      const tsFallback = (row['Timestamp'] || '').toString().trim();
      const candidate = waktuStr || tsFallback;
      let iso = new Date().toISOString();
      const parsedDate = new Date(candidate);
      if(candidate && !isNaN(parsedDate.getTime())){ iso = parsedDate.toISOString(); }
      return {
        moduleId: moduleId,
        moduleTitle: moduleTitle,
        staffId: (row['NIP (Nomor Induk Karyawan)'] || '').toString().trim(),
        name: (row['Nama Lengkap '] || row['Nama Lengkap'] || '').toString().trim(),
        pretestScore: parseInt(row['Skor Pre Test'], 10) || 0,
        posttestScore: parseInt(row['Skor Post Test'], 10) || 0,
        status: (row['Status'] || '').toString().trim(),
        timestamp: iso
      };
    }).filter(r => r.staffId);
    return { records, unavailable:false };
  }catch(e){ console.error('list failed', e); return { records:[], unavailable:false, error:true, message: e.message }; }
}

async function checkExistingAttempt(moduleId, staffId){
  try{
    const result = await listAllRecords();
    if(!result || !result.records) return null;
    const matches = result.records.filter(r => r.moduleId === moduleId && r.staffId === staffId);
    if(!matches.length) return null;
    matches.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
    return matches[0];
  }catch(e){ return null; }
}
async function onNipInput(){

async function startFlow(){

/* ================= RENDER: QUIZ (shared by pre/post) ================= */
function renderQuiz(){
  const m = MODULES[state.moduleId];
  const answers = currentPhase === 'pretest' ? state.pretestAnswers : state.posttestAnswers;
  const q = m.questions[currentQIdx];
  const label = currentPhase === 'pretest' ? 'PRE-TEST' : 'POST-TEST';
  document.getElementById('topSub').textContent = label + " — " + m.title;
  let progHtml = '<div class="progress">';
  for(let i=0;i<m.questions.length;i++){
    progHtml += `<div class="${i<currentQIdx?'done':(i===currentQIdx?'now':'')}"></div>`;
  }
  progHtml += '</div>';

  let optsHtml = '';
  q.opts.forEach((o,i)=>{
    const sel = answers[currentQIdx]===i ? 'selected' : '';
    optsHtml += `<div class="opt ${sel}" onclick="selectAnswer(${i})">
      <input type="radio" name="opt" ${answers[currentQIdx]===i?'checked':''} readonly>
      <div class="otext">${o}</div>
    </div>`;
  });

  document.getElementById('content').innerHTML = `
    ${progHtml}
    <div class="qnum">SOAL ${currentQIdx+1} DARI ${m.questions.length}</div>
    <div class="qtext">${q.q}</div>
    ${optsHtml}
    <div class="navrow">
      <button class="btn ghost" onclick="prevQ()" ${currentQIdx===0?'disabled':''}>Sebelumnya</button>
      <button class="btn" id="nextBtn" onclick="nextQ()" ${answers[currentQIdx]===null?'disabled':''}>${currentQIdx===m.questions.length-1?'Selesai':'Berikutnya'}</button>
    </div>
  `;
}
function selectAnswer(i){
  const answers = currentPhase === 'pretest' ? state.pretestAnswers : state.posttestAnswers;
  answers[currentQIdx] = i;
  renderQuiz();
}
function prevQ(){ if(currentQIdx>0){ currentQIdx--; renderQuiz(); } }
function nextQ(){
  const m = MODULES[state.moduleId];
  if(currentQIdx < m.questions.length-1){ currentQIdx++; renderQuiz(); }
  else{ finishQuiz(); }
}
function finishQuiz(){
  const m = MODULES[state.moduleId];
  const answers = currentPhase === 'pretest' ? state.pretestAnswers : state.posttestAnswers;
  let correct = 0;
  answers.forEach((a,i)=>{ if(a === m.questions[i].correct) correct++; });
  const score = Math.round((correct / m.questions.length) * 100);
  if(currentPhase === 'pretest'){
    state.pretestScore = score;
    renderPretestDone();
  }else{
    state.posttestScore = score;
    finalizeAndShowResult();
  }
}

function renderContentSection(sec){
  let html = `<div class="matcard">`;

  if(sec.title) html += `<h2>${sec.title}</h2>`;

  if(sec.bullets) html += `<ul class="matlist">${sec.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
  if(sec.numbered) html += `<ol class="matnumbered">${sec.numbered.map(b=>`<li>${b}</li>`).join('')}</ol>`;
  if(sec.table){
    html += `<table class="mattable"><thead><tr>${sec.table.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
    sec.table.rows.forEach(r=>{ html += `<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`; });
    html += `</tbody></table>`;
  }
  if(sec.columns){
    html += `<div class="matcolumns">`;
    sec.columns.forEach(col=>{
      html += `<div class="matcol"><h4>${col.title}</h4><ul>${col.bullets.map(b=>`<li>${b}</li>`).join('')}</ul></div>`;
    });
    html += `</div>`;

  if(sec.checklist){
    html += `<div class="matchecklist">${sec.checklist.map(c=>`<div class="checkitem">✓ ${c}</div>`).join('')}</div>`;
  }
  if(sec.note){ html += `<div class="matnote">${sec.note}</div>`; }
  html += `</div>`;
  return html;
}
function renderMateri(){

    ? `<img class="slideimg" src="${m.slides[state.slideIdx]}" alt="Slide ${state.slideIdx+1}">`
    : `<div class="mpage-wrap">${m.materiPages[state.slideIdx]}</div>`;

        ? `<button class="btn amber" onclick="goToPosttest()">Lanjut ke Post-Test</button>`
        : `<button class="btn" onclick="nextSlide()">Berikutnya</button>`}
    </div>
  `;
}
function prevSlide(){ if(state.slideIdx>0){ state.slideIdx--; renderMateri(); } }
function nextSlide(){ const m = MODULES[state.moduleId]; const total = moduleContentCount(m); if(state.slideIdx < total-1){ state.slideIdx++; renderMateri(); } }
function goToPosttest(){
  const m = MODULES[state.moduleId];
  currentPhase = 'posttest'; currentQIdx = 0; state.posttestAnswers = new Array(m.questions.length).fill(null);
  renderQuiz();
}

/* ================= FINAL RESULT ================= */
async function getPreviousAttemptNumber(moduleId, staffId){
  try{
    const result = await listAllRecords();
    if(!result || !result.records) return 0;
    return result.records.filter(r => r.moduleId === moduleId && r.staffId === staffId).length;
  }catch(e){ return 0; }
}
async function finalizeAndShowResult(){
  const m = MODULES[state.moduleId];
  const passed = state.posttestScore >= m.kkm;
  const prevAttempts = await getPreviousAttemptNumber(state.moduleId, state.staffId);
  const attemptNumber = prevAttempts + 1;
  const record = {
    moduleId: state.moduleId,
    moduleTitle: m.title,
    staffId: state.staffId,
    name: state.name,
    pretestScore: state.pretestScore,
    posttestScore: state.posttestScore,
    status: passed ? 'Kompeten' : 'Perlu Remediasi Tatap Muka',
    timestamp: new Date().toISOString(),
    attemptNumber: attemptNumber
  };
  const saveResult = await saveRecord(record);
  document.getElementById('topSub').textContent = "Hasil Akhir — " + state.name;
  const stillHasRetry = !passed && attemptNumber < 3;
  const circleColor = passed ? 'var(--good)' : (stillHasRetry ? 'var(--amber)' : 'var(--danger)');
  let reviewHtml = '';
  m.questions.forEach((q,i)=>{
    const ans = state.posttestAnswers[i];
    const isCorrect = ans === q.correct;
    reviewHtml += `<div class="card" style="margin-bottom:10px;">
      <div class="qtext" style="font-size:14px;">${i+1}. ${q.q}</div>
      <div style="font-size:13px;color:${isCorrect?'var(--good)':'var(--danger)'};font-weight:600;margin-bottom:4px;">
        Jawaban Anda: ${q.opts[ans]} ${isCorrect ? '(Benar)' : '(Kurang tepat)'}
      </div>
      ${!isCorrect ? `<div style="font-size:13px;color:var(--grey);">Jawaban tepat: ${q.opts[q.correct]}</div>` : ''}
      <div style="font-size:12.5px;color:var(--grey);margin-top:4px;font-style:italic;">${q.exp}</div>
    </div>`;
  });
  const saveWarningHtml = !saveResult.ok
    ? `<div class="banner warn" style="text-align:left;">
         <b>Hasil ini belum berhasil tersimpan ke sistem</b> (sudah dicoba ${saveResult.attempts || 1}x).
         Ini kemungkinan gangguan koneksi atau server sesaat. Coba klik "Simpan Lagi" dulu. Kalau masih gagal,
         salin ringkasan hasil dan kirim manual ke admin diklat sebagai cadangan.
         <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
           <button class="btn ghost" onclick="retrySaveRecord()">Simpan Lagi</button>
           <button class="btn ghost" onclick="copyResultSummary()">Salin Ringkasan Hasil</button>
         </div>
       </div>`
    : '';
  let statusHeading, statusMessageHtml, actionButtonsHtml;
  if(passed){
    statusHeading = 'Kompeten';
    statusMessageHtml = `<div class="banner info" style="text-align:left;">${saveResult.ok ? 'Selamat! Anda dinyatakan kompeten pada modul ini. Hasil telah tercatat secara otomatis.' : 'Selamat! Anda dinyatakan kompeten pada modul ini.'}</div>`;
    actionButtonsHtml = `<button class="btn" style="margin-top:8px;" onclick="renderStart()">Kembali ke Daftar Modul</button>`;
  }else if(stillHasRetry){
    statusHeading = 'Belum Lulus — Coba Lagi';
    const saran = attemptNumber === 1 ? 'baca ulang materi' : 'pelajari kembali materi dengan lebih teliti';
    statusMessageHtml = `<div class="banner warn" style="text-align:left;">Skor Post-Test Anda (${state.posttestScore}) masih di bawah KKM (${m.kkm}). Silakan ${saran}, lalu coba Post-Test sekali lagi. <b>(Percobaan ke-${attemptNumber} dari maksimal 3 sebelum dijadwalkan pelatihan tatap muka.)</b>${saveResult.ok ? ' Hasil percobaan ini telah tercatat.' : ''}</div>`;
    actionButtonsHtml = `<button class="btn amber" style="margin-top:8px;" onclick="startMateri()">Baca Ulang Materi &amp; Coba Lagi</button>
      <button class="btn ghost" style="margin-top:8px;margin-left:8px;" onclick="renderStart()">Kembali ke Daftar Modul</button>`;
  }else{
    statusHeading = 'Perlu Remediasi Tatap Muka';
    statusMessageHtml = `<div class="banner warn" style="text-align:left;">Skor Post-Test Anda masih di bawah KKM (${m.kkm}) setelah ${attemptNumber} kali percobaan. Anda akan dijadwalkan mengikuti <b>pelatihan tatap muka (offline)</b> oleh Kepala Instalasi Farmasi / bagian Diklat.${saveResult.ok ? ' Hasil ini telah tercatat.' : ''}</div>`;
    actionButtonsHtml = `<button class="btn" style="margin-top:8px;" onclick="renderStart()">Kembali ke Daftar Modul</button>`;
  }
  document.getElementById('content').innerHTML = `
    <div class="resultbig">
      <div class="scorecircle" style="background:${circleColor};">${state.posttestScore}</div>
      <h2>${statusHeading}</h2>
      <p style="color:var(--grey);font-size:14px;">${m.title}</p>
      <p style="color:var(--grey);font-size:14px;">Skor Pre-Test: <b>${state.pretestScore !== null ? state.pretestScore : 'Dilewati'}</b> &nbsp;→&nbsp; Skor Post-Test: <b>${state.posttestScore}</b> &nbsp;(KKM: ${m.kkm})</p>
      ${saveWarningHtml}
      ${statusMessageHtml}
      ${actionButtonsHtml}
    </div>
    <h3 style="margin-top:6px;">Pembahasan Jawaban</h3>
    ${reviewHtml}
  `;
  window._lastRecordForCopy = record;
}
async function retrySaveRecord(){
  const r = window._lastRecordForCopy;
  if(!r) return;
  const btn = event ? event.target : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Menyimpan...'; }
  const result = await saveRecord(r);
  if(result.ok){
    alert('Berhasil! Hasil sudah tersimpan ke sistem.');
    renderStart();
  }else{
    alert('Masih gagal tersimpan. Coba lagi sebentar lagi, atau gunakan tombol "Salin Ringkasan Hasil" untuk kirim manual ke admin.');
    if(btn){ btn.disabled = false; btn.textContent = 'Simpan Lagi'; }
  }
}
function copyResultSummary(){
  const r = window._lastRecordForCopy;
  if(!r) return;
  const text = `Hasil Diklat\nNama: ${r.name}\nNIP: ${r.staffId}\nModul: ${r.moduleTitle}\nSkor Pre-Test: ${r.pretestScore !== null && r.pretestScore !== undefined ? r.pretestScore : "Dilewati"}\nSkor Post-Test: ${r.posttestScore}\nStatus: ${r.status}\nWaktu: ${new Date(r.timestamp).toLocaleString('id-ID')}`;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert('Ringkasan hasil disalin. Silakan tempel & kirim ke admin.'));
  }else{
    prompt('Salin teks berikut dan kirim ke admin:', text);
  }
}

/* ================= ADMIN ================= */
function showAdminGate(){
  document.getElementById('topSub').textContent = "Dashboard Admin";
  document.getElementById('content').innerHTML = `
    <div class="card" style="max-width:380px;">
      <h3>Masuk Dashboard Admin</h3>
      <label>Kata Sandi</label>
      <input type="password" id="adminPass" placeholder="Masukkan kata sandi admin">
      <div style="margin-top:14px;"><button class="btn" onclick="checkAdminPass()">Masuk</button></div>
      <p style="font-size:11.5px;color:var(--grey);margin-top:10px;">Catatan: data hasil tersimpan bersama (shared) di dalam artifact ini dan dapat dilihat siapa pun yang membuka tautan pelatihan ini. Bagikan tautan hanya kepada staf & admin yang berwenang.</p>
    </div>
  `;
}
function checkAdminPass(){
  const p = document.getElementById('adminPass').value;
  if(p === 'farmasi2026'){ renderAdminDashboard(); }
  else{ alert('Kata sandi salah.'); }
}
async function renderAdminDashboard(){
  document.getElementById('content').innerHTML = `<p>Memuat data dari Google Sheets...</p>`;
  const result = await listAllRecords();
  window._loadError = result.error ? (result.message || 'Gagal memuat data.') : null;
  window._lastRecords = result.records;
  renderAdminBody();
}
function setAdminModuleFilter(id){ adminModuleFilter = id; renderAdminBody(); }
async function testStorageConnection(){
  const el = document.getElementById('storageTestResult');
  if(el) el.innerHTML = `<div class="banner info">Menguji koneksi ke Google Sheets (via Apps Script)...</div>`;
  const result = await listAllRecords();
  if(result.error){
    if(el) el.innerHTML = `<div class="banner warn"><b>Gagal:</b> ${result.message || 'Tidak bisa menghubungi Apps Script.'} Cek kembali GAPPS_SCRIPT_URL di kode, dan pastikan deployment Apps Script masih aktif dengan akses "Anyone".</div>`;
    return;
  }
  if(el) el.innerHTML = `<div class="banner info"><b>Berhasil.</b> Bisa membaca data dari Google Sheets (ditemukan ${result.records.length} baris data). Kalau data peserta tertentu tetap tidak muncul, kemungkinan pengiriman form-nya yang gagal, bukan pembacaannya.</div>`;
}
function setAdminViewMode(mode){ adminViewMode = mode; renderAdminBody(); }

function renderAdminBody(){
  const allRecords = window._lastRecords || [];
  const records = adminModuleFilter === 'all' ? allRecords : allRecords.filter(r=>r.moduleId===adminModuleFilter);
  const total = records.length;
  const passCount = records.filter(r=>r.status==='Kompeten').length;
  const failCount = total - passCount;
  const avgPost = total ? Math.round(records.reduce((s,r)=>s+r.posttestScore,0)/total) : 0;

  let tabsHtml = `<div class="tab ${adminModuleFilter==='all'?'active':''}" onclick="setAdminModuleFilter('all')">Semua Modul</div>`;
  Object.keys(MODULES).forEach(id=>{
    tabsHtml += `<div class="tab ${adminModuleFilter===id?'active':''}" onclick="setAdminModuleFilter('${id}')">${MODULES[id].title}</div>`;
  });

  let bodyHtml = '';
  if(adminViewMode === 'detail'){
    let rows = '';
    const sorted = [...records].sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp));
    sorted.forEach(r=>{
      const badge = r.status === 'Kompeten' ? '<span class="badge pass">Kompeten</span>' : '<span class="badge fail">Perlu Remediasi</span>';
      rows += `<tr>
        <td>${r.name}</td><td>${r.staffId}</td><td>${r.moduleTitle||r.moduleId}</td><td>${r.pretestScore !== null && r.pretestScore !== undefined ? r.pretestScore : "Dilewati"}</td><td>${r.posttestScore}</td>
        <td>${badge}</td><td>${new Date(r.timestamp).toLocaleString('id-ID')}</td>
      </tr>`;
    });
    if(!records.length){ rows = `<tr><td colspan="7" style="text-align:center;color:var(--grey);padding:24px;">Belum ada data peserta.</td></tr>`; }
    bodyHtml = `<div style="overflow-x:auto;">
      <table><thead><tr><th>Nama</th><th>NIK/ID</th><th>Modul</th><th>Pre-Test</th><th>Post-Test</th><th>Status</th><th>Waktu</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>`;
  }else{
    // pivot per staf x modul
    const staffMap = {};
    allRecords.forEach(r=>{
      const key = r.staffId;
      if(!staffMap[key]) staffMap[key] = { name:r.name, staffId:r.staffId, modules:{} };
      staffMap[key].modules[r.moduleId] = r;
    });
    const moduleIds = Object.keys(MODULES);
    let headCols = moduleIds.map(id=>`<th>${MODULES[id].title}</th>`).join('');
    let rows = '';
    Object.values(staffMap).forEach(s=>{
      let cols = moduleIds.map(id=>{
        const r = s.modules[id];
        if(!r) return `<td><span class="badge pending">Belum Ikut</span></td>`;
        const badge = r.status === 'Kompeten' ? `<span class="badge pass">Kompeten (${r.posttestScore})</span>` : `<span class="badge fail">Remediasi (${r.posttestScore})</span>`;
        return `<td>${badge}</td>`;
      }).join('');
      rows += `<tr><td>${s.name}</td><td>${s.staffId}</td>${cols}</tr>`;
    });
    if(!Object.keys(staffMap).length){ rows = `<tr><td colspan="${2+moduleIds.length}" style="text-align:center;color:var(--grey);padding:24px;">Belum ada data peserta.</td></tr>`; }
    bodyHtml = `<div style="overflow-x:auto;">
      <table><thead><tr><th>Nama</th><th>NIK/ID</th>${headCols}</tr></thead>
      <tbody>${rows}</tbody></table>
    </div>`;
  }

  document.getElementById('content').innerHTML = `
    ${window._loadError ? `<div class="banner warn">Gagal memuat data dari Google Sheets (${window._loadError}). Coba klik "Muat Ulang", atau cek manual di Google Sheets.</div>` : ''}

    <div id="storageTestResult"></div>
    <div class="toolbar">
      <h2 style="margin:0;">Rekap Peserta</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn ghost" onclick="testStorageConnection()">Tes Koneksi Penyimpanan</button>
        <button class="btn ghost" onclick="renderAdminDashboard()">Muat Ulang</button>
        <button class="btn ghost" onclick="exportCsv()">Unduh CSV</button>
        <button class="btn ghost" onclick="renderStart()">Ke Halaman Peserta</button>
      </div>
    </div>
    <div class="tabs">${tabsHtml}</div>
    <div class="tabs">
      <div class="tab ${adminViewMode==='detail'?'active':''}" onclick="setAdminViewMode('detail')">Rekap per Percobaan</div>
      <div class="tab ${adminViewMode==='pivot'?'active':''}" onclick="setAdminViewMode('pivot')">Rekap per Staf (lintas modul)</div>
    </div>
    <div class="statgrid">
      <div class="statbox"><div class="num">${total}</div><div class="lbl">TOTAL PERCOBAAN</div></div>
      <div class="statbox"><div class="num">${passCount}</div><div class="lbl">KOMPETEN</div></div>
      <div class="statbox"><div class="num">${failCount}</div><div class="lbl">PERLU REMEDIASI</div></div>
      <div class="statbox"><div class="num">${avgPost}</div><div class="lbl">RATA-RATA POST-TEST</div></div>
    </div>
    ${bodyHtml}
  `;
}
function exportCsv(){
  const allRecords = window._lastRecords || [];
  const records = adminModuleFilter === 'all' ? allRecords : allRecords.filter(r=>r.moduleId===adminModuleFilter);
  let csv = "Nama,NIK/ID,Modul,Pre-Test,Post-Test,Status,Waktu\n";
  records.forEach(r=>{
    csv += `"${r.name}","${r.staffId}","${r.moduleTitle||r.moduleId}",${r.pretestScore},${r.posttestScore},"${r.status}","${new Date(r.timestamp).toLocaleString('id-ID')}"\n`;
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'rekap_diklat_farmasi.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ================= INIT ================= */
renderStart();
</script>
</body>
</html>
